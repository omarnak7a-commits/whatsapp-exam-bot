version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jebt_kam_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jebt_kam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jebt_kam_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/jebt_kam_db
      SECRET_KEY: super_secret_jwt_key_for_jebt_kam_platform_change_in_prod_2026
      JWT_SECRET: super_secret_jwt_key_for_jebt_kam_platform_change_in_prod_2026
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      APP_ENV: development
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: admin@exam.com
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python app/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jebt_kam_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
